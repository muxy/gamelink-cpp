name: Verify Unity native libraries
on:
  push:
    branches: [codex/clear-empty-unity]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES='x86_64;arm64'
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build library and tests
        run: cmake --build build --config Release --target cgamelink tests --parallel 2
      - name: Run tests and exercise the built library
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/tests.exe
            python test/unity_binary_smoke.py "$(pwd)/build/Release/cgamelink.dll"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ./build/tests
            python3 test/unity_binary_smoke.py "$(pwd)/build/libcgamelink.dylib"
          else
            ./build/tests
            python3 test/unity_binary_smoke.py "$(pwd)/build/libcgamelink.so"
          fi
      - name: Check macOS architectures
        if: runner.os == 'macOS'
        run: lipo build/libcgamelink.dylib -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            build/Release/cgamelink.dll
            build/libcgamelink.so
            build/libcgamelink.dylib
          if-no-files-found: error

