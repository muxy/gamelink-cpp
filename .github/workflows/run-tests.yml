name: Validate and release GameLink C++

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgGitCommitId: b5229343b4b80264ed51e89c6a7dcd0cbe85e9cc
          doNotCache: false
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DGAMELINK_BUILD_TESTS=ON
          -DGAMELINK_BUILD_EXAMPLES=ON
          -DGAMELINK_BUILD_SHARED=ON
          -DBUILD_INTEGRATION_TESTS=OFF
      - name: Build public surfaces
        run: cmake --build build --target gamelink_tests amalgam_compile_check amalgam_drift cgamelink_compile_check examples
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release
          find build -type f \( -name 'cgamelink.dll' -o -name 'cgamelink.lib' -o -name 'libcgamelink.dylib' -o -name 'libcgamelink.so' \) -exec cp {} release/ \;
          if [ "${RUNNER_OS}" = "Linux" ]; then
            cp build/generated/gamelink_single.hpp release/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cgamelink-${{ runner.os }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cgamelink-*
          path: release
          merge-multiple: true
      - name: Verify and package release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version vcpkg.json)" = "$version"
          grep -F '#define MUXY_GAMELINK_VERSION_MAJOR 0' include/config.h
          grep -F '#define MUXY_GAMELINK_VERSION_MINOR 2' include/config.h
          grep -F '#define MUXY_GAMELINK_VERSION_PATCH 0' include/config.h
          git archive --format=tar.gz --prefix="muxy-gamelink-cpp-$version/" -o "release/muxy-gamelink-cpp-$version-source.tar.gz" HEAD
          (cd release && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
